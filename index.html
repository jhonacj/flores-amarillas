<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jardín de flores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#040608;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  canvas{ display:block; width:100%; height:100%; }
  
  canvas.settled{ animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ filter: drop-shadow(0 0 10px rgba(255,218,71,.05)); }
    50%{ filter: drop-shadow(0 0 25px rgba(255,218,71,.12)); }
  }

  .gate{ position:fixed; inset:0; z-index:3; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px;
    background:radial-gradient(circle at 50% 50%, #0c121c, #040608 80%); }
  .gate p.title{ margin:0; font-family:"Fraunces",serif; font-style:italic; font-weight:400;
    font-size:1.35rem; color:rgba(255,255,255,.85); }
  .gate input{ background:none; border:none; border-bottom:1px solid rgba(255,255,255,.3);
    color:#fff; font-family:"Fraunces",serif; font-style:italic; font-size:1.8rem;
    text-align:center; padding:10px; width:min(85vw,400px); outline:none; transition:border-color .3s; }
  .gate input::placeholder{ color:rgba(255,255,255,.15); }
  .gate input:focus{ border-color:rgba(255,218,71,.9); }
  .gate button{ margin-top:15px; background:none; cursor:pointer; border:1px solid rgba(255,255,255,.4);
    color:rgba(255,255,255,.9); font-family:"Fraunces",serif; font-size:1.05rem;
    padding:12px 35px; border-radius:30px; transition:all .3s ease; }
  .gate button:hover{ color:#000; border-color:#ffda47; background:#ffda47; box-shadow:0 0 20px rgba(255,218,71,.4); }

  .overlay{ position:fixed; left:0; right:0; bottom:30px; z-index:2;
    display:flex; justify-content:center;
    opacity:0; transition:opacity 1.5s ease; pointer-events:none; }
  .overlay button{ pointer-events:auto; background:rgba(0,0,0,.6); cursor:pointer; border:1px solid rgba(255,218,71,.3);
    color:rgba(255,218,71,.8); font-family:"Fraunces",serif; font-size:.9rem; letter-spacing:.05em; 
    padding:10px 35px; border-radius:30px; backdrop-filter:blur(5px); transition:all .3s ease; }
  .overlay button:hover{ color:#000; border-color:#ffda47; background:#ffda47; box-shadow:0 0 15px rgba(255,218,71,.4); }
</style>
</head>
<body>

<div class="gate" id="gate">
  <p class="title">Siembra un jardín</p>
  <input id="nameInput" type="text" placeholder="escribe tu nombre..." autocomplete="off" maxlength="25" />
  <button id="startBtn">Cultivar</button>
</div>

<canvas id="c" style="display:none;"></canvas>

<div class="overlay" id="ui-buttons">
  <button id="btnRestart">Sembrar nuevo jardín</button>
</div>

<script>
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// PALETA ESTANDARIZADA: Tonos Tierra, Naranja Vibrante y Oro Solar
const MAIN_PALETTE = ['#5c2e0b', '#d97604', '#ffda47'];

function hashSeed(str){
  let h = 0; for(let i=0;i<str.length;i++) h = (Math.imul(31,h) + str.charCodeAt(i)) | 0;
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function analyzeName(str){
  const s = str.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let chars = []; 
  for(let i=0; i<str.length; i++) {
    if(str[i].trim() === '') continue;
    chars.push(str[i].toUpperCase()); 
  }
  return { chars, text: str.trim() };
}

const easeOutCubic = t => 1-Math.pow(1-t,3);
const easeOutBack = t => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };

function createLetterMap(char, maxRadius){
  const size = Math.ceil(maxRadius * 2); 
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d', {willReadFrequently: true});
  
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${size*0.75}px "Fraunces", serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(char, size/2, size/2 + size*0.06); 
  
  return { data: ctx.getImageData(0,0,size,size).data, size };
}

function buildPlant(rnd, baseX, groundY, trunkLen, branchLen, branchAngleBase, isLetter){
  let x=baseX, y=groundY, heading=90;
  const segs=[], leaves=[];
  function fwd(len){
    const rad = heading*Math.PI/180;
    const nx = x + len*Math.cos(rad), ny = y - len*Math.sin(rad);
    segs.push({x1:x,y1:y,x2:nx,y2:ny}); x=nx; y=ny;
  }
  
  fwd(trunkLen);
  fwd(trunkLen);
  
  let branchPoint = {x,y,heading};
  heading += branchAngleBase + (rnd()*8-4);
  fwd(branchLen*0.65);
  leaves.push({x:x, y:y, angle:heading, length:branchLen, width:branchLen*0.48});
  x=branchPoint.x; y=branchPoint.y; heading=branchPoint.heading;
  
  fwd(trunkLen);
  
  branchPoint = {x,y,heading};
  heading -= branchAngleBase + (rnd()*8-4);
  fwd(branchLen*0.65);
  leaves.push({x:x, y:y, angle:heading, length:branchLen, width:branchLen*0.48});
  x=branchPoint.x; y=branchPoint.y; heading=branchPoint.heading;

  if(isLetter) fwd(trunkLen * 0.8); 

  segs.forEach((s,i)=> s.tone = i/(segs.length-1));
  return { segments:segs, leaves, topX:x, topY:y };
}

function buildFlower(rnd, cx, cy, petalCount, radius, charStr){
  const petals=[], dots=[], glowDots=[];
  const off = rnd()*360;
  
  for(let j=0;j<petalCount;j++){
    const theta = off + j*(360/petalCount) + (rnd()*4-2);
    const len = radius*(0.85+rnd()*0.2);
    const width = Math.max(4, radius*Math.min(0.8,(2*Math.PI*0.6)/petalCount));
    petals.push({cx,cy,theta,len,width});
  }
  
  const golden = 137.508 * Math.PI/180;
  const isLetter = !!charStr;
  // círculo central más chico: antes 0.55 tapaba casi toda la flor y
  // no dejaba ver los pétalos. 0.4 deja la letra legible sin deformar.
  const dotMaxR = isLetter ? radius*0.4 : radius*0.35; 
  
  // SOLUCIÓN DE RESOLUCIÓN: Densidad constante basada en el área (radio al cuadrado)
  const area = dotMaxR * dotMaxR;
  // subimos el multiplicador para compensar el área más chica y mantener la letra nítida
  const dotCount = Math.min(2500, Math.floor(area * (isLetter ? 0.65 : 0.08))); 
  
  const letterMap = isLetter ? createLetterMap(charStr, dotMaxR) : null;

  for(let k=0; k<dotCount; k++){
    const r = dotMaxR*Math.sqrt(k/dotCount);
    const a = k*golden;
    
    const relX = r*Math.cos(a);
    const relY = r*Math.sin(a);
    let isGlowing = false;

    if(letterMap){
      const mapX = Math.floor(letterMap.size/2 + relX);
      const mapY = Math.floor(letterMap.size/2 + relY);
      if(mapX >= 0 && mapX < letterMap.size && mapY >= 0 && mapY < letterMap.size){
        const pixelIndex = (mapY * letterMap.size + mapX) * 4;
        if(letterMap.data[pixelIndex] > 128) isGlowing = true; 
      }
    }
    
    const dotObj = { x:cx+relX, y:cy+relY, r: Math.max(1.3, radius*(isGlowing?0.032:0.02)) };
    
    if(isGlowing) glowDots.push(dotObj);
    else dots.push(dotObj);
  }
  const centerBacking = isLetter ? {cx, cy, r: dotMaxR*1.1} : null;
  return { petals, dots, glowDots, centerBacking };
}

function buildGrass(rnd, w, groundY){
  const blades = [];
  const count = Math.floor(w * 0.8); 
  for(let i=0; i<count; i++){
    blades.push({
      x: rnd() * w,
      y: groundY + (rnd()*20 - 5),
      h: 15 + rnd()*35,
      bend: (rnd() - 0.5) * 30,
      tone: rnd()
    });
  }
  return blades;
}

function buildGarden(nameData, w, h){
  const seed = hashSeed(nameData.text);
  const rnd = mulberry32(seed);
  const plants=[];
  
  const baseGroundY = h * 0.92;
  const grass = buildGrass(rnd, w, baseGroundY);

  // Generar Estrellas
  const stars = [];
  for(let i=0; i<100; i++){
    stars.push({ x: rnd()*w, y: rnd()*h*0.75, r: 0.5 + rnd()*1.2, offset: rnd()*Math.PI*2 });
  }

  // Generar Luciérnagas
  const fireflies = [];
  for(let i=0; i<30; i++){
    fireflies.push({ 
      x: rnd()*w, y: h*0.5 + rnd()*h*0.4, 
      speed: 0.0005 + rnd()*0.0015, offset: rnd()*Math.PI*2, r: 1.5 + rnd()*2 
    });
  }

  // Flores de fondo
  const numBg = 20 + Math.floor(rnd()*15); 
  for(let i=0; i<numBg; i++){
    const z = rnd() * 0.5; 
    const groundY = baseGroundY - (z * h * 0.2);
    const baseX = w * (0.02 + rnd()*0.96);
    const scaleZ = 0.3 + z * 0.6;
    const stepLen = h * 0.08 * scaleZ * (0.8 + rnd()*0.4);
    
    const plant = buildPlant(rnd, baseX, groundY, stepLen, stepLen, 20+rnd()*15, false);
    const petalCount = [8,10,12,14][Math.floor(rnd()*4)];
    const flowerRadius = Math.min(w,h)*0.09 * scaleZ * (0.7 + rnd()*0.6);
    
    const flower = buildFlower(rnd, plant.topX, plant.topY, petalCount, flowerRadius, null);
    plants.push({ ...plant, petalCount, flower, z, isLetter:false, delay: z*1000 + rnd()*600 });
  }
  
  // Flores frontales (Letras)
  // en pantallas angostas, mostrar demasiadas letras las apretaba
  // demasiado y las volvía ilegibles: se limita según el ancho real.
  const maxChars = w < 480 ? 10 : (w < 900 ? 14 : 18);
  const chars = nameData.chars.slice(0, maxChars);
  const maxAncho = Math.min(w * 0.85, 1100);
  const spacing = maxAncho / Math.max(1, chars.length);
  const startX = (w - (spacing * (chars.length - 1))) / 2;

  for(let i=0; i<chars.length; i++){
    const z = 0.7 + (rnd()*0.3); 
    const arc = Math.sin((i / Math.max(1, chars.length - 1)) * Math.PI);
    const groundY = baseGroundY + 10 - (arc * h * 0.04); 
    
    const baseX = startX + i * spacing;
    const scaleZ = 0.85 + z * 0.15;
    // el tallo ahora crece según el alto de pantalla, sin importar
    // cuántas letras haya: por eso ya no queda "al nivel del pasto"
    // cuando el nombre es largo. Las ramas/hojas sí se limitan al
    // espacio horizontal disponible, para no invadir la flor vecina.
    const trunkLen = h * 0.11 * scaleZ * (0.9 + rnd()*0.2);
    const branchLen = Math.min(trunkLen*0.7, spacing * 0.38);
    
    const plant = buildPlant(rnd, baseX, groundY, trunkLen, branchLen, 25+rnd()*10, true);
    const petalCount = [12,15,18,21][Math.floor(rnd()*4)];
    
    // tamaño estandarizado, con un piso más alto para que la letra
    // de puntos siga siendo legible incluso si el nombre es largo.
    const idealRadius = Math.max(30, Math.min(56, h*0.085));
    const flowerRadius = Math.max(24, Math.min(idealRadius, spacing * 0.62));
    const flower = buildFlower(rnd, plant.topX, plant.topY, petalCount, flowerRadius, chars[i]);
    
    const delay = 1500 + (i * 450) + rnd()*200; 
    plants.push({ ...plant, char:chars[i], petalCount, flower, z, isLetter:true, delay });
  }
  
  return { text: nameData.text, grass, stars, fireflies, plants, h };
}

function buildTimeline(garden){
  const items=[];
  
  garden.grass.forEach((blade, i) => {
    items.push({ z: -1, delay: i * 3, duration: 800, kind: 'grass', blade, ease: easeOutCubic });
  });

  garden.plants.forEach(plant => {
    const segDur = 250;
    plant.segments.forEach((seg,idx) => {
      items.push({ z:plant.z, delay:plant.delay+idx*segDur, duration:segDur, kind:'stem', seg, ease:easeOutCubic });
    });
    const stemDone = plant.delay + plant.segments.length*segDur;
    
    plant.leaves.forEach((leaf,idx) => {
      items.push({ z:plant.z, delay:plant.delay+(idx*180), duration:450, kind:'leaf', leaf, ease:easeOutBack });
    });
    
    const flowerDelay = stemDone + 150;
    plant.flower.petals.forEach((petal,j) => {
      items.push({ z:plant.z, delay:flowerDelay+(j/plant.petalCount)*600, duration:550, kind:'petal', petal, ease:easeOutBack });
    });
    
    const dotsDelay = flowerDelay + 700;

    if(plant.isLetter && plant.flower.centerBacking){
      items.push({ z:plant.z, delay:dotsDelay, duration:400, kind:'centerBack', back:plant.flower.centerBacking, ease:easeOutCubic });
    }

    plant.flower.dots.forEach((dot,k) => {
      items.push({ z:plant.z, delay:dotsDelay+(k*3), duration:300, kind:'dot', dot, ease:easeOutCubic });
    });
    
    if(plant.isLetter){
      plant.flower.glowDots.forEach((gDot, k) => {
        items.push({ 
          z: plant.z + 0.1, 
          delay: dotsDelay + 500 + (k*4), 
          duration: 600, 
          kind: 'glowDot', 
          dot: gDot, 
          ease: easeOutBack 
        });
      });
    }
  });

  items.push({
    z: 100, delay: 4000, duration: 2000, kind: 'title', text: `Sembré una flor pensando en ti, y desde entonces, mi primavera no tiene fin`, ease: easeOutCubic
  });
  
  items.sort((a,b) => a.z - b.z);
  return items;
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio,2);

function resizeCanvas(){
  const w=window.innerWidth, h=window.innerHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function hexToRgb(hex){ hex = hex.replace('#',''); return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)]; }
function lerpHex(a,b,t){
  const A=hexToRgb(a), B=hexToRgb(b);
  return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;
}

function drawGrass(blade, e){
  const tx = blade.x + blade.bend * e;
  const ty = blade.y - blade.h * e;
  ctx.strokeStyle = lerpHex('#112110', '#2a4524', blade.tone);
  ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(blade.x, blade.y); 
  ctx.quadraticCurveTo(blade.x + blade.bend/2, blade.y - blade.h/2, tx, ty); 
  ctx.stroke();
}
function drawStem(seg,e){
  const tx = seg.x1+(seg.x2-seg.x1)*e, ty = seg.y1+(seg.y2-seg.y1)*e;
  ctx.strokeStyle = lerpHex('#1e331b', '#486e3f', seg.tone);
  ctx.lineWidth = 4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(seg.x1,seg.y1); ctx.lineTo(tx,ty); ctx.stroke();
}
function drawLeaf(leaf,e){
  ctx.save(); ctx.translate(leaf.x,leaf.y); ctx.rotate(-leaf.angle*Math.PI/180); ctx.scale(e,e);
  const L=leaf.length, w=leaf.width/2;
  const grad = ctx.createLinearGradient(0,0,L,0);
  grad.addColorStop(0, '#2e4a27'); grad.addColorStop(1, '#538047');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.bezierCurveTo(L*0.25,-w*1.2, L*0.75,-w*1.0, L,0);
  ctx.bezierCurveTo(L*0.75,w*1.0, L*0.25,w*1.2, 0,0);
  ctx.fill(); ctx.restore();
}
function drawPetal(petal, e){
  ctx.save(); ctx.translate(petal.cx,petal.cy); ctx.rotate(-petal.theta*Math.PI/180); ctx.scale(e,e);
  const len=petal.len, w=petal.width;
  const grad = ctx.createLinearGradient(0,0,0,-len);
  grad.addColorStop(0, MAIN_PALETTE[1]); grad.addColorStop(1, MAIN_PALETTE[2]);
  ctx.fillStyle = grad;
  ctx.shadowColor = MAIN_PALETTE[0]; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.bezierCurveTo(-w*0.55,-len*0.25, -w*0.65,-len*0.65, 0,-len);
  ctx.bezierCurveTo(w*0.65,-len*0.65, w*0.55,-len*0.25, 0,0);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawBaseDot(dot,e){
  ctx.shadowBlur=0;
  ctx.fillStyle='#2b1a0d'; 
  ctx.beginPath(); ctx.arc(dot.x,dot.y,dot.r*e,0,Math.PI*2); ctx.fill();
}
function drawGlowDot(dot, e){
  ctx.shadowColor = MAIN_PALETTE[2]; 
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#fff8ea'; 
  ctx.beginPath(); ctx.arc(dot.x,dot.y,dot.r*e,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0; 
}
function drawCenterBack(back, e){
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(20,10,4,.5)';
  ctx.beginPath(); ctx.arc(back.cx, back.cy, back.r*e, 0, Math.PI*2); ctx.fill();
}
function wrapLines(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for(const word of words){
    const test = line ? line + ' ' + word : word;
    if(line && ctx.measureText(test).width > maxWidth){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines;
}
function drawTitle(text, e, w, h){
  ctx.save();
  ctx.globalAlpha = e;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.shadowColor = 'rgba(255,255,255,0.4)';
  ctx.shadowBlur = 10;
  const fontSize = Math.max(13, Math.min(w * 0.032, 26));
  ctx.font = `italic 400 ${fontSize}px "Fraunces", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const lines = wrapLines(ctx, text, w * 0.84);
  const lineHeight = fontSize * 1.35;
  const startY = h * 0.06;
  lines.forEach((ln,i) => ctx.fillText(ln, w/2, startY + i*lineHeight));
  ctx.restore();
}

let garden=null, timeline=[], gStartTime=0, gRafId=null;

function renderAt(elapsed){
  const w=canvas.width/dpr, h=canvas.height/dpr;
  ctx.clearRect(0,0,w,h); 
  
  // Dibujar Estrellas Animadas
  ctx.fillStyle = '#ffffff';
  garden.stars.forEach(s => {
    ctx.globalAlpha = 0.2 + Math.sin(elapsed * 0.001 + s.offset) * 0.2;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1; // reset

  // Suelo Base
  ctx.fillStyle = '#060a0f';
  ctx.fillRect(0, garden.h * 0.92, w, h * 0.1);

  let allDone=true;
  for(const it of timeline){
    const t = Math.max(0, Math.min(1,(elapsed-it.delay)/it.duration));
    if(t<1) allDone=false;
    if(t<=0) continue;
    const e = it.ease(t);
    
    if(it.kind==='grass') drawGrass(it.blade, e);
    else if(it.kind==='stem') drawStem(it.seg,e);
    else if(it.kind==='leaf') drawLeaf(it.leaf,e);
    else if(it.kind==='petal') drawPetal(it.petal,e);
    else if(it.kind==='dot') drawBaseDot(it.dot,e);
    else if(it.kind==='glowDot') drawGlowDot(it.dot,e);
    else if(it.kind==='centerBack') drawCenterBack(it.back,e);
    else if(it.kind==='title') drawTitle(it.text, e, w, h);
  }

  // Dibujar Luciérnagas Animadas (Capa superior)
  garden.fireflies.forEach(f => {
    const alpha = 0.3 + Math.sin(elapsed * f.speed + f.offset) * 0.5;
    const moveY = Math.sin(elapsed * f.speed * 0.8 + f.offset) * 15;
    const moveX = Math.cos(elapsed * f.speed * 0.5 + f.offset) * 15;
    ctx.shadowBlur = 12; 
    ctx.shadowColor = MAIN_PALETTE[2]; 
    ctx.fillStyle = `rgba(255,218,71,${alpha})`;
    ctx.beginPath(); ctx.arc(f.x + moveX, f.y + moveY, f.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; // reset
  });

  return allDone;
}

function frameLoop(now){
  if(!gStartTime) gStartTime=now;
  const done = renderAt(now-gStartTime);
  if(!done){
    gRafId = requestAnimationFrame(frameLoop);
  } else {
    canvas.classList.add('settled');
    document.getElementById('ui-buttons').style.opacity = 1;
  }
}

function startGarden(nameStr){
  if(!nameStr.trim()) return;
  document.getElementById('gate').style.display = 'none';
  canvas.style.display = 'block';
  document.getElementById('ui-buttons').style.opacity = 0;
  canvas.classList.remove('settled');
  
  document.fonts.ready.then(() => {
    resizeCanvas();
    const nameData = analyzeName(nameStr);
    garden = buildGarden(nameData, canvas.width/dpr, canvas.height/dpr);
    timeline = buildTimeline(garden);
    gStartTime = 0;
    if(gRafId) cancelAnimationFrame(gRafId);

    if(REDUCED){
      const maxEnd = Math.max(...timeline.map(it=>it.delay+it.duration));
      renderAt(maxEnd);
      canvas.classList.add('settled');
      document.getElementById('ui-buttons').style.opacity = 1;
      return;
    }
    gRafId = requestAnimationFrame(frameLoop);
  });
}

document.getElementById('startBtn').addEventListener('click', () => {
  startGarden(document.getElementById('nameInput').value);
});
document.getElementById('nameInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') startGarden(document.getElementById('nameInput').value);
});

document.getElementById('btnRestart').addEventListener('click', () => {
  canvas.style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('nameInput').value = '';
  document.getElementById('nameInput').focus();
});

window.addEventListener('resize', () => {
  if(canvas.style.display === 'block') startGarden(garden.text);
});
document.getElementById('nameInput').focus();
</script>
</body>
</html>
